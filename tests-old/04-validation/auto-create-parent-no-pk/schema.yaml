tables:
  # Parent table WITHOUT a primary key
  categories:
    columns:
      category_name:
        definition: varchar(100)
      total_amount:
        definition: integer default 0

  # Child table attempting auto-create-parent on FK to table without PK
  transactions:
    columns:
      transaction_id:
        definition: serial primary key
      amount:
        definition: integer
    foreign-keys:
      category_name:
        table: categories
        auto-create-parent: true
