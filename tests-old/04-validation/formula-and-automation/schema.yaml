tables:
  accounts:
    columns:
      account_id: serial primary key
      credits: numeric(10,2)
      debits: numeric(10,2)
      # INVALID: Cannot have both formula and automation
      balance:
        definition: numeric(10,2)
        formula: "@credits - @debits"
        automation: SUM @transactions.amount

  transactions:
    foreign-keys:
      account_fk: accounts
    columns:
      transaction_id: serial primary key
      account_fk: integer
      amount: numeric(10,2)
