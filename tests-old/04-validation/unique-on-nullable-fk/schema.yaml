tables:
  categories:
    columns:
      id:
        definition: serial primary key
      name:
        definition: varchar(100)

  products:
    columns:
      id:
        definition: serial primary key
      name:
        definition: varchar(100)
    foreign-keys:
      # Nullable FK (not-null: false)
      category_id:
        table: categories
        not-null: false
    # Unique constraint on nullable FK (valid but may warn)
    unique-constraints:
      - [category_id]
