tables:
  students:
    columns:
      student_id: serial primary key
      email: varchar(100) unique
      name: varchar(100)

  courses:
    columns:
      course_id: serial primary key
      code: varchar(10) unique
      title: varchar(100)

  enrollments:
    columns:
      enrollment_id: serial primary key
      semester: varchar(20)
      grade: varchar(2)
      enrollment_date: date

    foreign-keys:
      student: students
      course: courses

    unique-constraints:
      - [student, course, semester]  # Can only enroll once per course per semester

    indexes:
      - [enrollment_date]            # Query by date
      - [semester, grade]            # Reports by semester and grade
