tables:
  accounts:
    columns:
      account_id: serial primary key
      balance:
        definition: numeric(10,2)
        automation: SUM @transactions.amount

  transactions:
    foreign-keys:
      account_fk: accounts
    columns:
      transaction_id: serial primary key
      account_fk: integer
      amount: numeric(10,2)
      # Circular: Transaction captures account balance at time of transaction
      balance_snapshot:
        definition: numeric(10,2)
        automation: SNAPSHOT @accounts.balance
