tables:
  event_master:
    comment: Parent table with serial PK that spreads to child rows
    columns:
      master_id: serial primary key
      event_name: varchar(50)
      start_date: date
      end_date: date
      frequency: varchar(20)

  event_spread:
    comment: Child table with auto-generated rows via SPREAD
    foreign-keys:
      master_id:
        table: event_master
        auto-create:
          on: [insert, update]
          spread:
            start: start_date
            end: end_date
            interval: frequency
            generated_column: spread_date
    columns:
      spread_id: serial primary key
      spread_date: date
      status: varchar(20) default 'pending'
