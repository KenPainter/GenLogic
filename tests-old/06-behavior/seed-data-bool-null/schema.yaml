tables:
  users:
    columns:
      id: serial primary key
      email: varchar(255) unique
      active: boolean
      verified: boolean
      phone: varchar(20)
      bio: text
    seed-rows:
      - email: active@example.com
        active: true
        verified: true
        phone: "555-1234"
        bio: "Active user"
      - email: inactive@example.com
        active: false
        verified: false
        phone: null
        bio: null
