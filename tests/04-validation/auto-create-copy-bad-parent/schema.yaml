tables:
  projects:
    columns:
      id:
        definition: serial primary key
      name:
        definition: varchar(100)

  tasks:
    columns:
      id:
        definition: serial primary key
      task_name:
        definition: varchar(100)
    foreign_keys:
      project_id:
        table: projects
        auto_create:
          on: [insert]
          copy_columns:
            # Non-existent parent column
            nonexistent_parent_col: task_name
