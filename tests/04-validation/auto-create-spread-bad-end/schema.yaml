tables:
  projects:
    columns:
      id:
        type: serial primary key
      start_date:
        type: date

  tasks:
    columns:
      id:
        type: serial primary key
      date:
        type: date
    foreign_keys:
      project_id:
        table: projects
        auto_create:
          on: [insert]
          spread:
            start: start_date
            # Non-existent end column
            end: nonexistent_end
            interval: day_interval
            generated_column: date
