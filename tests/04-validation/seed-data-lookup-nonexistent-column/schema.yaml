tables:
  categories:
    columns:
      id:
        type: serial primary key
      name:
        type: varchar(100)

  products:
    columns:
      id:
        type: serial primary key
      name:
        type: varchar(100)
    foreign_keys:
      category_id: categories
    seed-rows:
      - id: 1
        name: "Widget"
        # $lookup where clause references non-existent column
        category_id_id:
          $lookup:
            table: categories
            where: {nonexistent_column: "Electronics"}
