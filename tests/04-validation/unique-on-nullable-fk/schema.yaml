tables:
  categories:
    columns:
      id:
        type: serial primary key
      name:
        type: varchar(100)

  products:
    columns:
      id:
        type: serial primary key
      name:
        type: varchar(100)
    foreign_keys:
      # Nullable FK (not_null: false)
      category_id:
        table: categories
        not_null: false
    # Unique constraint on nullable FK (valid but may warn)
    unique_constraints:
      - [category_id]
