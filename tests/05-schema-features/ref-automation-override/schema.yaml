columns:
  base_col:
    definition: numeric(10,2)
    automation: SUM @items.amount

tables:
  items:
    columns:
      id: serial primary key
      amount: numeric(10,2)
    foreign_keys:
      parent: parents

  parents:
    columns:
      id: serial primary key
      total:
        $ref: base_col
        automation: COUNT @items.amount  # Override automation from SUM to COUNT
