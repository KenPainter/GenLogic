tables:
  orders:
    columns:
      order_id: serial primary key
      max_price:
        definition: numeric(10,2)
        automation: MAX @order_items.unit_price

  order_items:
    foreign-keys:
      order_fk: orders
    columns:
      item_id: serial primary key
      order_fk: integer
      unit_price: numeric(10,2)
