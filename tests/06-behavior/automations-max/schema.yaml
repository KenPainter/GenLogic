tables:
  portfolios:
    columns:
      id: integer primary key
      name: varchar(50)
      max_investment:
        definition: numeric(10,2)
        automation: MAX @investments.amount

  investments:
    columns:
      id: integer primary key
      portfolio_id: integer
      amount: numeric(10,2)
    foreign_keys:
      portfolio: { table: portfolios }
