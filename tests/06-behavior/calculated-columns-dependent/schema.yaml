tables:
  orders:
    columns:
      id: integer primary key
      quantity: integer
      unit_price: numeric(10,2)
      subtotal:
        definition: numeric(10,2)
        formula: "@quantity * @unit_price"
      tax:
        definition: numeric(10,2)
        formula: "@subtotal * 0.08"
      total:
        definition: numeric(10,2)
        formula: "@subtotal + @tax"
