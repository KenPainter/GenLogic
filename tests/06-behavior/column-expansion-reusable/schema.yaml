# Test reusable column expansion (user's scenario)
# description was VARCHAR(50), now VARCHAR(120)

columns:
  description: varchar(120)  # Expanded from 50 to 120
  short_name: varchar(30)

tables:
  products:
    columns:
      id: serial primary key
      name:
        $ref: description
      notes:
        $ref: description
      code:
        $ref: short_name

  categories:
    columns:
      id: serial primary key
      title:
        $ref: description
      abbreviation:
        $ref: short_name
