tables:
  settings:
    columns:
      id: serial primary key
      key: varchar(50) unique
      config: jsonb
      tags: jsonb
    seed-rows:
      - key: app_config
        config:
          debug: true
          max_connections: 100
          features: [auth, api, webhooks]
        tags: [production, critical]
      - key: ui_settings
        config:
          theme: dark
          language: en
          notifications:
            email: true
            sms: false
        tags: [user-facing]
