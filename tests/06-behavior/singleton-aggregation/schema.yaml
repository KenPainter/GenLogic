tables:
  global_totals:
    columns:
      id: integer primary key
      total_sales:
        definition: numeric(10,2)
        automation: SUM @sales.amount
      sale_count:
        definition: integer
        automation: COUNT @sales.id
    seed-rows:
      - id: 1  # Singleton row

  sales:
    columns:
      id: serial primary key
      global_totals_id: integer default 1  # All sales reference the singleton row
      amount: numeric(10,2)
      sale_date: date
    foreign-keys:
      global_totals: global_totals
