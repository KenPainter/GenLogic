tables:
  schedules:
    columns:
      schedule_id: serial primary key
      schedule_name: varchar(50)
      start_date: date
      end_date: date
      frequency: varchar(20)

  scheduled_occurrences:
    foreign_keys:
      schedule_id:
        table: schedules
        auto_create:
          on: [insert]
          spread:
            start: start_date
            end: end_date
            interval: frequency
            generated_column: occurrence_date

    columns:
      occurrence_id: serial primary key
      occurrence_date: date
