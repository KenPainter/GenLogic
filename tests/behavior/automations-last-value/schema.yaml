tables:
  devices:
    columns:
      id: integer primary key
      name: varchar(50)
      last_reading:
        type: numeric(10,2)
        automation:
          type: LAST_VALUE
          table: readings
          foreign_key: device
          column: value

  readings:
    columns:
      id: integer primary key
      device_id: integer
      value: numeric(10,2)
      timestamp: timestamp
    foreign_keys:
      device: { table: devices }
