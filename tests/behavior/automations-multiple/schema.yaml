tables:
  accounts:
    columns:
      id: integer primary key
      name: varchar(50)
      total_amount:
        type: numeric(10,2)
        automation:
          type: SUM
          table: transactions
          foreign_key: account
          column: amount
      transaction_count:
        type: integer
        automation:
          type: COUNT
          table: transactions
          foreign_key: account
          column: id
      max_transaction:
        type: numeric(10,2)
        automation:
          type: MAX
          table: transactions
          foreign_key: account
          column: amount

  transactions:
    columns:
      id: integer primary key
      account_id: integer
      amount: numeric(10,2)
    foreign_keys:
      account: { table: accounts }
