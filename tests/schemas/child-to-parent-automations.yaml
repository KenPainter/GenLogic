# Child-to-parent automations - comprehensive test of all aggregation types
tables:
  accounts:
    columns:
      account_id: serial primary key
      name: varchar(100)
      # Test all aggregation types
      total_amount:
        definition: numeric(12,2)
        automation: SUM @transactions.amount
      transaction_count:
        definition: integer
        automation: COUNT @transactions.id
      min_amount:
        definition: numeric(12,2)
        automation: MIN @transactions.amount
      max_amount:
        definition: numeric(12,2)
        automation: MAX @transactions.amount
      # Test aggregation with WHERE clause
      debit_total:
        definition: numeric(12,2)
        automation: SUM @transactions.amount WHERE @transactions.type = 'debit'
      credit_total:
        definition: numeric(12,2)
        automation: SUM @transactions.amount WHERE @transactions.type = 'credit'
      # Test named FK when child has multiple FKs to same parent
      transfer_in_total:
        definition: numeric(12,2)
        automation: SUM(account_id_to) @transfers.amount
      transfer_out_total:
        definition: numeric(12,2)
        automation: SUM(account_id_from) @transfers.amount

  transactions:
    foreign-keys:
      accounts: account_id
    columns:
      id: serial primary key
      account_id: integer
      amount: numeric(12,2)
      type: varchar(10)

  # Current format, with no need to redefined account_id_from 
  # column or account_id_to column because they are inferred
  transfers:
    foreign-keys:
      accounts:
        - account_id_from
        - account_id_to
    columns:
      transfer_id: serial primary key
      amount: numeric(12,2)

  # Proposed format: more explicit, less magic
  # TYPE is still inferred from parent table
  transfers:
    columns:
      transfer_id: serial primary key
      account_id_from: FK accounts not null
      account_id_to: FK accounts not null
      account_id_crazy:
        definition: fk accounts not null
        formula: > 
          case when @account_id_from < 100 
          then @account_id_from
          else @account_id_to end
      amount: numeric(12,2)
