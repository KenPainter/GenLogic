# Test constant substitution - should PASS
constants:
  DEFAULT_USER_ID: 1
  MAX_LENGTH: 100
  DEFAULT_STATUS: active

tables:
  users:
    columns:
      id: serial primary key
      name: varchar(${MAX_LENGTH})
      status: varchar(20) default '${DEFAULT_STATUS}'
      created_by_id: integer default ${DEFAULT_USER_ID}
